[package]
name = "iced_forms_gen"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Добавляем шаблонизатор и форматтер кода:
tera = { version = "2.1.*", features = ["glob_fs"] }
#rustfmt-wrapper = "0.2.1"

# Массивы 
indexmap = { version = "2.0", features = ["serde"] }

# Логи
log = "0.4"
env_logger = "0.11"
flexi_logger = "0.29"   # Логер с поддержкой файлов и консоли

# Парсер аргументов командной строки:
clap = { version = "4.5", features = ["derive"] }

# Парсер конфигурации Toml
toml = "0.8"